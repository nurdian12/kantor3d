name: Deploy ke VPS
# Jalan saat ada push ke cabang di bawah, atau manual (tab Actions -> Run workflow).
on:
  push:
    branches: [claude/nice-babbage-mkytfe]
  workflow_dispatch:

concurrency: deploy   # satu deploy dalam satu waktu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan kunci SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Update & restart di VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER_@$HOST" 'bash /opt/kantor3d/deploy/deploy.sh'
